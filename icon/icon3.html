<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,900&family=Inter:wght@800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#000}
.ic{width:1024px;height:1024px;position:relative;overflow:hidden;
 background:linear-gradient(180deg,#050a12 0%,#0b1a2a 45%,#0f3a44 72%,#1c5a5e 80%,#0c1724 100%)}
.beam{position:absolute;top:-140px;width:240px;height:1000px;background:linear-gradient(180deg,rgba(255,255,255,.13),transparent 70%);filter:blur(10px)}
.b1{left:20px;transform:rotate(-22deg)}.b2{right:20px;transform:rotate(22deg)}
.est{position:absolute;left:0;right:0;top:66px;display:flex;justify-content:center;align-items:center;gap:22px;font:800 36px/1 Inter,sans-serif;letter-spacing:14px;color:rgba(255,255,255,.6)}
.est span{padding-left:14px}
.ks{width:36px;height:36px;fill:#c8102e}
.mark{position:absolute;left:0;right:0;top:104px;text-align:center;font:italic 900 400px/1 'Barlow Condensed',sans-serif;color:#fff;letter-spacing:-6px;
 text-shadow:0 11px 0 #c8102e,0 24px 44px rgba(0,0,0,.7)}
.sky{position:absolute;left:0;top:594px;width:1024px;height:330px}
.field{position:absolute;left:-10%;right:-10%;bottom:0;height:250px;transform:perspective(520px) rotateX(55deg);transform-origin:bottom;
 background:repeating-linear-gradient(90deg,transparent 0 118px,rgba(255,255,255,.16) 118px 124px),linear-gradient(0deg,#00515a,#00343a)}
.banner{position:absolute;left:150px;right:150px;top:506px;height:70px;background:#c8102e;transform:skewX(-14deg);border-radius:4px;display:grid;place-items:center;box-shadow:0 10px 24px rgba(0,0,0,.5)}
.banner b{transform:skewX(14deg);font:800 44px/1 Inter,sans-serif;letter-spacing:16px;color:#fff;padding-left:16px}
</style></head><body><div class="ic">
<div class="beam b1"></div><div class="beam b2"></div>
<svg style="display:none"><symbol id="keystone" viewBox="0 0 30 30"><path d="M3 2h24l-3 7 3 0-4 19H7L3 9h3z"/></symbol></svg>
<div class="est"><svg class="ks"><use href="#keystone"/></svg><span>EST. 2011</span><svg class="ks"><use href="#keystone"/></svg></div>
<div class="mark">PHY</div>
<svg class="sky" viewBox="0 0 1024 330" id="sky">
 <g id="bldg" fill="#060c14"></g>
 <g id="win" fill="#ffd58a"></g>
</svg>
<div class="field"></div>
<div class="banner"><b>SPORTS PAGE</b></div>
</div>
<script>
const B=document.getElementById('bldg'),W=document.getElementById('win'),NS='http://www.w3.org/2000/svg';
const add=(g,t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);g.appendChild(e);return e};
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const base=330;
// filler blocks
[[0,60,210],[55,50,180],[100,70,230],[860,60,200],[915,55,240],[965,70,190],[300,40,250],[505,45,235],[650,45,215],[770,50,225]].forEach(([x,w,top])=>add(B,'rect',{x,y:top,width:w,height:base-top}));
const poly=p=>add(B,'polygon',{points:p});
// City Hall: base, tower, clock, dome, William Penn
add(B,'rect',{x:150,y:245,width:150,height:85});
add(B,'rect',{x:200,y:150,width:50,height:100});
add(B,'rect',{x:206,y:118,width:38,height:34});
poly('206,118 225,82 244,118');
add(B,'rect',{x:223,y:66,width:4,height:18});add(B,'circle',{cx:225,cy:63,r:4});
add(W,'circle',{cx:225,cy:135,r:9,fill:'#fff3d0'});
// Two Liberty Place
add(B,'rect',{x:335,y:120,width:52,height:210});poly('335,120 361,62 387,120');
// One Liberty Place
add(B,'rect',{x:405,y:72,width:66,height:258});add(B,'rect',{x:413,y:56,width:50,height:18});
poly('413,56 438,8 463,56');add(B,'rect',{x:436,y:-6,width:4,height:16});
// Comcast Center
poly('545,330 547,40 582,18 620,40 622,330');
// BNY Mellon Center
add(B,'rect',{x:690,y:96,width:60,height:234});add(B,'rect',{x:698,y:80,width:44,height:18});poly('698,80 720,50 742,80');
// lit windows
B.querySelectorAll('rect,polygon').forEach(el=>{const b=el.getBBox();if(b.width<30)return;
 for(let y=b.y+14;y<base-10;y+=13)for(let x=b.x+6;x<b.x+b.width-8;x+=10)
  if(rnd()<.28)add(W,'rect',{x,y,width:4,height:6,opacity:(.5+rnd()*.5).toFixed(2)});});
// spire lights
[[361,66],[438,10],[582,22],[720,54]].forEach(([cx,cy])=>add(W,'circle',{cx,cy,r:4,fill:'#ff4d6a'}));
</script></body></html>
